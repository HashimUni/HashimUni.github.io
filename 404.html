<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://hashimportfolio.me/404.html" />
  <script>
    (function () {
      try {
        var path = window.location.pathname;
        var search = window.location.search;
        if (path && path !== "/" && path !== "/index.html" && path !== "/404.html") {
          window.location.replace("/#" + path + search);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <title>404 - Page Not Found | Hashim Umar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #010818;
      color: #ffffff;
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(100px, 20vw, 250px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(to top, #2f80ed, #56ccf2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: clamp(18px, 4vw, 30px);
      font-weight: 500;
      color: #aaa6c3;
      margin-top: 0.25rem;
    }
    .message {
      color: #aaa6c3;
      font-size: clamp(14px, 2vw, 16px);
      max-width: 500px;
      margin: 1.5rem auto 2rem;
    }
    .home-link {
      display: inline-block;
      background: #0a0a0a;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 12px;
      transition: box-shadow 0.2s;
    }
    .home-link:hover {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 3rem;
      max-width: 600px;
    }
    .nav-links a {
      color: #aaa6c3;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      padding: 8px 18px;
      border: 1px solid rgba(170, 166, 195, 0.3);
      border-radius: 8px;
      transition: border-color 0.2s, color 0.2s;
    }
    .nav-links a:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <h1 class="error-code">404</h1>
  <p class="subtitle">Page Not Found</p>
  <p class="message">
    The page you're looking for doesn't exist or has been moved. Let me help you find your way back.
  </p>
  <a class="home-link" href="https://hashimportfolio.me">Go Home  </a>
</body>
</html>
